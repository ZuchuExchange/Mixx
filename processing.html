<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment</title>
    <style>
        /* Light green background and centered layout */
        body {
            background-color: #e8f5e9; /* Soft light green */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #2e7d32; /* Dark green for text */
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 600;
        }

        /* Thick round processing spinner */
        .spinner {
            border: 8px solid #c8e6c9; /* Light green track */
            border-top: 8px solid #4caf50; /* Vibrant green moving part */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Status Text Messaging */
        #status-text {
            font-size: 16px;
            font-weight: bold;
            color: #388e3c;
            min-height: 24px;
        }

        /* Small Custom Red Alert Window in the center */
        .alert-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .alert-box {
            background: #ffebee; /* Light red/pink */
            border: 2px solid #c62828; /* Dark red border */
            color: #c62828;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 300px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner" id="loading-spinner"></div>
        <h1>Processing Your Payment</h1>
        <p id="status-text">Checking transaction status...</p>
    </div>

    <div class="alert-overlay" id="error-alert">
        <div class="alert-box" id="error-message">
            An error occurred.
        </div>
    </div>

    <script>
        // Configuration Constants
        const STATUS_URL = "https://pesaflux-server200.onrender.com/status";
        const POLLING_INTERVAL = 5000; // 5 seconds
        const MAX_POLLING_TIME = 60000; // 60 seconds total

        const statusText = document.getElementById('status-text');
        const errorAlert = document.getElementById('error-alert');
        const errorMessage = document.getElementById('error-message');

        // Function to display the error window for 3 seconds, then go to payment1.html
        function triggerErrorAlert(messageText) {
            errorMessage.textContent = messageText;
            errorAlert.style.display = 'flex'; // Show modal

            setTimeout(() => {
                errorAlert.style.display = 'none';
                window.location.href = "payment1.html";
            }, 3000);
        }

        // Main logic execution block
        async function verifyPayment() {
            const transactionRequestId = (localStorage.getItem("request_id") || "").trim();

            if (!transactionRequestId) {
                triggerErrorAlert("Error: No Request ID found in storage!");
                return;
            }

            let timeElapsed = 0;

            const pollInterval = setInterval(async () => {
                try {
                    timeElapsed += POLLING_INTERVAL;

                    const response = await fetch(STATUS_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ transaction_request_id: transactionRequestId })
                    });

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok || data.ok === false) {
                        throw new Error(data.message || data.error || `Server returned status ${response.status}`);
                    }

                    const status = String(data.status || "").toLowerCase();

                    if (status === 'completed' || status === 'success') {
                        clearInterval(pollInterval);
                        statusText.style.color = "#1b5e20";
                        statusText.textContent = "Success! Payment Completed. Redirecting...";

                        setTimeout(() => {
                            window.location.href = "payment2.html";
                        }, 1500);
                        return;
                    }

                    if (status === 'failed' || status === 'cancelled' || status === 'reversed') {
                        clearInterval(pollInterval);
                        triggerErrorAlert(data.result_desc || data.message || "Payment was not completed.");
                        return;
                    }

                    // Pending / PromptSent / still processing
                    statusText.textContent = "Still waiting for PIN confirmation...";
                } catch (error) {
                    clearInterval(pollInterval);
                    triggerErrorAlert(error.message || "Network Error occurred.");
                }

                if (timeElapsed >= MAX_POLLING_TIME) {
                    clearInterval(pollInterval);
                    window.location.href = "payment1.html";
                }
            }, POLLING_INTERVAL);
        }

        window.addEventListener('DOMContentLoaded', verifyPayment);
    </script>
</body>
</html>
